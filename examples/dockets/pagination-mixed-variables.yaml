# Mixed: Path Variables + Path Pagination
# Combines docket configuration variables with pagination path parameters

name: mixed-path-variables-pagination
version: 1.0.0
type: Poller

plugin_location: plugins/KeryxFlux.Plugins.PaginatedExample/bin/Debug/net8.0/KeryxFlux.Plugins.PaginatedExample.dll

configuration:
  org_id: "ORG456"
  facility_code: "MAIN"
  resource_type: "Encounter"

scheduler:
  cron_expression: "0 */15 * * * *"
  
  server:
    name: "FHIR Server with Complex Path"
    # Mix of:
    # - Configuration variables: {org_id}, {facility_code}, {resource_type}
    # - Pagination variables: {page_number}, {page_size}
    address: "https://fhir.hospital.com/org/{org_id}/facility/{facility_code}/{resource_type}/{page_number}/{page_size}"
    timeout_seconds: 60
  
  pagination:
    strategy: "offset-limit"
    page_size: 25
    max_pages: 50
    
    options:
      use_path_parameters: "true"
      
      # Pagination placeholders (different names to avoid confusion)
      page_path_placeholder: "page_number"  # Matches {page_number}
      page_size_path_placeholder: "page_size"  # Matches {page_size}
      
      page_field_name: "page"
      total_pages_field_name: "totalPages"

forwarding:
  destinations:
    - name: encounter-archive
      type: http
      # Destination can also use configuration variables
      url: "https://archive.hospital.com/{org_id}/{facility_code}/encounters"
      timeout_seconds: 90

telemetry:
  enabled: true
