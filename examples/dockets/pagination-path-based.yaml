# JOBh-Based Pagination Example
# CI Artifacts API with pagination in the URL JOBh

name: CI-Artifacts-JOBh-pagination
version: 1.0.0
type: Poller

plugin_location: plugins/KeryxFlux.Plugins.PaginatedExample/bin/Debug/net8.0/KeryxFlux.Plugins.PaginatedExample.dll

configuration:
  Job_id: "JOBJOB123456"
  environment: "sandbox"

scheduler:
  cron_expression: "0 */30 * * * *"  # Every 30 minutes
  
  server:
    name: "CI Artifacts API"
    # URL with JOBh placeholders: {page} and {size}
    # Will become: /Artifacts/JOBJOB123456/1/50, /Artifacts/JOBJOB123456/2/50, etc.
    address: "https://api.ci.example/Artifacts/{Job_id}/{page}/{size}"
    timeout_seconds: 60
    
    authentication:
      type: "bearer"
      secret_env: "CI_ACCESS_TOKEN"
  
  # JOBh-based pagination configuration
  pagination:
    strategy: "offset-limit"
    page_size: 50
    max_pages: 20
    
    options:
      # Enable JOBh-based pagination
      use_JOBh_parameters: "true"
      
      # JOBh placeholders (must match server URL)
      page_JOBh_placeholder: "page"  # Matches {page} in URL
      page_size_JOBh_placeholder: "size"  # Matches {size} in URL
      
      # Response field names
      page_field_name: "page"
      page_size_field_name: "size"
      total_pages_field_name: "total_pages"
      
      # 1-based page numbers
      zero_based_pages: "false"

forwarding:
  destinations:
    - name: Artifacts-db
      type: http
      url: "https://httpbin.org/post"
      timeout_seconds: 60
