# Multi-Organization CI System Integration
# ONE docket handles ALL organizations and endpoints!

name: ci-system-multi-org
version: 1.0.0
type: Poller

plugin_location: plugins/KeryxFlux.Plugins.PaginatedExample/bin/Debug/net8.0/KeryxFlux.Plugins.PaginatedExample.dll

# Base configuration shared across ALL orgs/endpoints
base_configuration:
  org_id: "CI-ORG-001"
  environment: "production"
  api_version: "v1"
  system_name: "CI-Platform"

# Server template (variables resolved per org/endpoint)
scheduler:
  # Default cron for all org/endpoint combinations
  cron_expression: "0 */30 * * * *"  # Every 30 minutes
  
  server:
    name: "CI API Server"
    # Path template with variables: {org_id}, {tenant_id}, {endpoint_id}
    address: "https://api.ci.example/org/{org_id}/location/{tenant_id}/{endpoint_id}"
    timeout_seconds: 60
    
    authentication:
      type: "bearer"
      secret_env: "CI_API_TOKEN"

# List of organizations to poll (tenants)
tenants:
  - tenant_id: "MAIN"
    display_name: "Main Datacenter"
    configuration:
      region: "North"
      priority: "high"
      
  - tenant_id: "WEST"
    display_name: "West Cloud Region"
    configuration:
      region: "South"
      priority: "medium"
      
  - tenant_id: "EAST"
    display_name: "East Edge Location"
    configuration:
      region: "East"
      priority: "high"
    # Override cron for this location (hourly instead of 30 min)
    cron_expression: "0 0 * * * *"
    
  - tenant_id: "NORTH"
    display_name: "North Backup Site"
    configuration:
      region: "North"
      priority: "low"

# List of endpoints to poll for each tenant
endpoints:
  - endpoint_id: "Runs"
    display_name: "CI Runs"
    pagination:
      strategy: "offset-limit"
      page_size: 100
      max_pages: 20
      options:
        use_path_parameters: "false"
        
  - endpoint_id: "Artifacts"
    display_name: "Build Artifacts"
    pagination:
      strategy: "cursor"
      page_size: 50
      max_pages: 0  # Unlimited
      options:
        paging_object_path: "link"
        next_cursor_field_name: "next"
        
  - endpoint_id: "Deployments"
    display_name: "Deployment Records"
    pagination:
      strategy: "offset-limit"
      page_size: 200
      max_pages: 10

# Overrides for specific tenant/endpoint combinations
overrides:
  # WEST location doesn't have Artifacts endpoint
  - tenant_id: "WEST"
    endpoint_id: "Artifacts"
    enabled: false
    
  # MAIN datacenter has priority handling with different pagination
  - tenant_id: "MAIN"
    endpoint_id: "Runs"
    configuration:
      priority_location: "true"
      run_filter: "status=active"
    pagination:
      page_size: 50  # Smaller batches for VIP handling
      max_pages: 30
      
  # NORTH is low priority, runs less frequently
  - tenant_id: "NORTH"
    endpoint_id: "Encounter"
    cron_expression: "0 0 */3 * * *"  # Every 3 hours instead of 30 min

# Multi-tenant execution configuration
multi_tenant:
  max_parallel_jobs: 8  # Run up to 8 tenant/endpoint combos in parallel
  fail_fast: false      # Continue on failure (partial success OK)
  job_start_delay_ms: 500  # 500ms delay between starting each job

# Global forwarding (tenant/endpoint variables available in URL)
forwarding:
  destinations:
    - name: data-warehouse
      type: http
      # Tenant-specific destination paths
      url: "https://warehouse.example.com/{org_id}/{tenant_id}/{endpoint_id}/data"
      timeout_seconds: 120

telemetry:
  enabled: true
  trace_requests: true
