# Example HTTP Receiver Docket
# Receives webhook events via HTTP POST and forwards to processing system

name: webhook-event-receiver
version: 1.0.0
type: receiver
plugin_location: ./plugins/EventParser.dll

# HTTP receiver configuration
receiver:
  type: http
  endpoint: /receive/webhooks
  
  authentication:
    type: api_key
    header: X-API-Key
    secret_env: WEBHOOK_API_KEY
  
  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst_size: 20
  
  processing:
    mode: async
    timeout_seconds: 30
    max_concurrent: 10

# Forwarding destinations
forwarding:
  destinations:
    - name: primary-processor
      type: http
      url: https://processor.example.com/api/events
      method: POST
      
      retry_policy:
        max_attempts: 3
        backoff_strategy: exponential
        initial_delay_seconds: 1
        max_delay_seconds: 60
      
      headers:
        Content-Type: application/json
        Authorization: Bearer ${PROCESSOR_TOKEN}
      
      timeout_seconds: 30
        
    - name: audit-stream
      type: kafka
      bootstrap_servers: kafka:9092
      topic: event-audit-log
      partition_key: patient_id

# Telemetry
telemetry:
  trace_requests: true
  log_level: Information
  metrics:
    - request_count
    - processing_duration
    - transformation_errors
    - forwarding_attempts
