# Example Scheduled Poller Docket
# Polls CI API every 15 minutes for new run data

name: ci-runs-poller
version: 1.0.0
type: poller
plugin_location: ./plugins/DataParser.dll

# Scheduling configuration
scheduler:
  cron_expression: "*/15 * * * *"  # Every 15 minutes
  timezone: America/New_York
  queue: default
  timeout_seconds: 300
  enabled: true

# Source server configuration
server_information:
  name: ci-api
  address: https://api.ci.example
  port: 443
  communication_type: http
  timeout_seconds: 30
  
  authentication:
    type: oauth2
    token_url: https://api.ci.example/oauth/token
    client_id_env: CI_CLIENT_ID
    client_secret_env: CI_CLIENT_SECRET
    scope: "runs:read"
    
  retry_policy:
    max_attempts: 3
    backoff_strategy: exponential

# Endpoints to poll
endpoints:
  - name: recent-runs
    path: /v1/runs?updated_after={last_run_time}
    max_attempts: 3
    is_cached: true
    cached_property: last_run_time
    template_arguments:
      - name: last_run_time
        format: "yyyy-MM-ddTHH:mm:ssZ"

# Forwarding configuration
forwarding:
  destinations:
    - name: run-queue
      type: rabbitmq
      connection_env: RABBITMQ_CONNECTION
      exchange: ci-updates
      routing_key: run.created
      persistent: true
      
    - name: backup-storage
      type: http
      url: https://backup.example.com/api/jobs
      method: POST
      retry_policy:
        max_attempts: 3
        backoff_strategy: exponential

# Telemetry
telemetry:
  trace_requests: true
  log_level: Information
