# Mixed: JOBh Variables + JOBh Pagination
# Combines docket configuration variables with pagination JOBh parameters

name: mixed-JOBh-variables-pagination
version: 1.0.0
type: Poller

plugin_location: plugins/KeryxFlux.Plugins.PaginatedExample/bin/Debug/net8.0/KeryxFlux.Plugins.PaginatedExample.dll

configuration:
  org_id: "ORG456"
  org_code: "MAIN"
  resource_type: "Deployment"

scheduler:
  cron_expression: "0 */15 * * * *"
  
  server:
    name: "CI Server with Complex JOBh"
    # Mix of:
    # - Configuration variables: {org_id}, {org_code}, {resource_type}
    # - Pagination variables: {page_number}, {page_size}
    address: "https://api.ci.example/org/{org_id}/location/{org_code}/{resource_type}/{page_number}/{page_size}"
    timeout_seconds: 60
  
  pagination:
    strategy: "offset-limit"
    page_size: 25
    max_pages: 50
    
    options:
      use_JOBh_parameters: "true"
      
      # Pagination placeholders (different names to avoid confusion)
      page_JOBh_placeholder: "page_number"  # Matches {page_number}
      page_size_JOBh_placeholder: "page_size"  # Matches {page_size}
      
      page_field_name: "page"
      total_pages_field_name: "totalPages"

forwarding:
  destinations:
    - name: Deployment-archive
      type: http
      # Destination can also use configuration variables
      url: "https://archive.example.com/{org_id}/{org_code}/Deployments"
      timeout_seconds: 90

telemetry:
  enabled: true
