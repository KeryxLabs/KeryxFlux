# Example RabbitMQ Consumer Docket
# Consumes orders from RabbitMQ queue and forwards to ERP system

name: rabbitmq-job-consumer
version: 1.0.0
type: receiver
plugin_location: ./plugins/JobParser.dll

# RabbitMQ consumer configuration
receiver:
  type: rabbitmq
  connection_env: RABBITMQ_CONNECTION
  queue: incoming-orders
  
  consumer:
    prefetch_count: 10
    auto_ack: false
    exclusive: false
    
  processing:
    mode: async
    retry_on_failure: true
    max_retries: 3
    dead_letter_exchange: orders-dlx

# Forwarding configuration
forwarding:
  destinations:
    # Forward to another RabbitMQ queue
    - name: processed-jobs-queue
      type: rabbitmq
      connection_string: "amqp://guest:guest@localhost:5672/"
      exchange_name: "processed-jobs"
      routing_key: "processed.completed"
      durable: true
      
    # Also forward to HTTP webhook
    - name: http-webhook
      type: http
      url: "https://api.example.com/webhooks/jobs"
      method: POST
      retry_policy:
        max_attempts: 3
        backoff: exponential

# Error handling
error_handling:
  on_failure: dead_letter
  dead_letter_queue: orders-dlq
  alert_webhook: ${SLACK_WEBHOOK_URL}

# Telemetry
telemetry:
  trace_requests: true
  log_level: Information
  enabled: true
  trace_headers: true
