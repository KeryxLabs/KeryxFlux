# Multi-Organization Sync with Different Lookback Windows
#
# Scenario: Managing multiple organizations with different CI systems.
# Each organization has different data delay characteristics:
# - Main Org: Modern system, 1-hour delay max
# - Edge Org: Legacy system, 4-hour delays common
# - Quick Sync Org: Real-time system, 30-minute lookback sufficient
#
# This demonstrates tenant-level date variable overrides.

name: multi-org-ci-sync
version: 1.0.0
type: poller
plugin_location: ./plugins/DataParser.dll

# Default date variable for all tenants (can be overridden)
date_variables:
  - name: lookback_date
    offset_expression: "-1h"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    timezone: "UTC"
    description: "Default 1-hour lookback"

scheduler:
  cron_expression: "*/30 * * * *"  # Default: every 30 minutes
  queue: multi-tenant-sync

# Multi-tenant configuration
multi_tenant:
  max_parallel_jobs: 5
  fail_fast: false
  job_start_delay_ms: 1000  # 1 second delay between starting each tenant

# Tenants with organization-specific overrides
tenants:
  - tenant_id: ORG_MAIN
    display_name: "Main Organization - Primary"
    enabled: true
    configuration:
      org_code: "ORG001"
      region: "central"
    # Uses default 1-hour lookback
    
  - tenant_id: EDGE_ORG
    display_name: "Edge Organization"
    enabled: true
    configuration:
      org_code: "ORG002"
      region: "northwest"
    # Override: 4-hour lookback due to legacy system delays
    date_variables:
      - name: lookback_date
        offset_expression: "-4h"
        format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
        description: "Extended lookback for legacy system delays"
    
  - tenant_id: QUICKSYNC_EAST
    display_name: "Quick Sync - East Location"
    enabled: true
    configuration:
      org_code: "ORG003"
      region: "east"
    # Override: More frequent polling with shorter lookback
    cron_expression: "*/15 * * * *"  # Every 15 minutes
    date_variables:
      - name: lookback_date
        offset_expression: "-30m"
        format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
        description: "Short lookback for real-time data"
    
  - tenant_id: QUICKSYNC_WEST
    display_name: "Quick Sync - West Location"
    enabled: true
    configuration:
      org_code: "ORG004"
      region: "west"
    cron_expression: "*/15 * * * *"
    date_variables:
      - name: lookback_date
        offset_expression: "-30m"
        format: "yyyy-MM-dd'T'HH:mm:ss'Z'"

# Endpoints to poll for each tenant
endpoints:
  - endpoint_id: Runs
    display_name: "CI Runs"
    enabled: true
    pagination:
      strategy: "link-header"
      page_size: 100
    configuration:
      resource_type: "Runs"
      # URL template uses both tenant config and date variable
      base_url: "https://api.ci.example/{tenant_id}/v1/runs?updated_after={lookback_date}"
  
  - endpoint_id: Artifacts
    display_name: "Build Artifacts"
    enabled: true
    pagination:
      strategy: "link-header"
      page_size: 50
    configuration:
      resource_type: "Artifacts"
      base_url: "https://api.ci.example/{tenant_id}/v1/artifacts?created_after={lookback_date}"

# Base configuration shared across all tenant/endpoint combinations
base_configuration:
  api_version: "v1"
  environment: "production"
  
forwarding:
  destinations:
    - name: centralized-data-lake
      type: http
      url: "https://datalake.example.com/api/ci/{tenant_id}/{resource_type}"
      method: POST
      headers:
        X-Source-System: "KeryxFlux-MultiTenant"
      retry_policy:
        max_attempts: 3
        backoff: exponential

telemetry:
  enabled: true
  trace_headers: true

# Resulting jobs (tenant × endpoint matrix):
# 1. ORG_MAIN :: Runs           (every 30 min, -1h lookback)
# 2. ORG_MAIN :: Artifacts      (every 30 min, -1h lookback)
# 3. EDGE_ORG :: Runs           (every 30 min, -4h lookback)
# 4. EDGE_ORG :: Artifacts      (every 30 min, -4h lookback)
# 5. QUICKSYNC_EAST :: Runs     (every 15 min, -30m lookback)
# 6. QUICKSYNC_EAST :: Artifacts (every 15 min, -30m lookback)
# 7. QUICKSYNC_WEST :: Runs     (every 15 min, -30m lookback)
# 8. QUICKSYNC_WEST :: Artifacts (every 15 min, -30m lookback)
