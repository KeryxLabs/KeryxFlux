# 30-Day Backfill for CI Run Data
#
# Scenario: CI system issue was fixed. Need to backfill 30 days of run updates
# that were missed during the outage.
#
# This docket retrieves all run records updated in the last 30 days.
# Use pagination to handle large result sets.
#
# Example:
# - Current time: 2025-01-15 10:00:00 UTC
# - Backfill start: 2024-12-16 10:00:00 UTC (30 days ago)
# - Backfill end: 2025-01-15 10:00:00 UTC (now)

name: ci-runs-backfill-30days
version: 1.0.0
type: poller
plugin_location: ./plugins/DataParser.dll

# Date variables: 30-day time range
date_variables:
  - name: backfill_start
    offset_expression: "-30d"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    timezone: "UTC"
    description: "Start of backfill period (30 days ago)"
    
  - name: backfill_end
    offset_expression: "0"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    timezone: "UTC"
    description: "End of backfill period (current time)"

scheduler:
  # Run once manually, or schedule for off-hours
  cron_expression: "0 2 * * SAT"  # Saturdays at 2 AM (for weekly backfills)
  queue: backfill
  server:
    name: ci-api-backfill
    address: "https://api.ci.example/v1/runs?updated_after={backfill_start}&updated_before={backfill_end}"
    type: http
    authentication:
      type: oauth2
      token_url: "https://api.ci.example/oauth2/token"
      client_id_env: CI_CLIENT_ID
      client_secret_env: CI_CLIENT_SECRET
    timeout_seconds: 120

# Critical for backfill: handle large result sets
pagination:
  strategy: "link-header"
  page_size: 500  # Larger page size for backfill
  max_pages: 0    # No limit - fetch all data

forwarding:
  destinations:
    - name: backfill-storage
      type: http
      url: "https://warehouse.example.com/api/backfill/runs"
      method: POST
      headers:
        X-Backfill-Job: "ci-runs-30day-backfill"
      retry_policy:
        max_attempts: 5
        backoff: exponential

telemetry:
  enabled: true
  trace_headers: true
