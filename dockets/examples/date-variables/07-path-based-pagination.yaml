# Path-Based Pagination with All Variable Types
#
# Demonstrates non-standard pagination where page parameters are in the URL path
# instead of query parameters.
#
# API Pattern: /resource/{org_id}/{page_number}/{page_size}?filters
#
# Example: https://api.ci.example/Jobs/GetLatest/ORG001/1/50?since=2025-01-15T14:00:00Z

name: path-based-pagination-example
version: 1.0.0
type: poller
plugin_location: ./plugins/JsonParser.dll

# ????????????????????????????????????????????????????????????????
# 1. STATIC VARIABLES (Configuration)
# ????????????????????????????????????????????????????????????????
configuration:
  environment: production
  api_base: "https://api.ci.example"
  # These are static and don't change per page
  job_id: "12345"
  page_size: "50"

# ????????????????????????????????????????????????????????????????
# 2. DATE VARIABLES (Dynamic Time-Based)
# ????????????????????????????????????????????????????????????????
date_variables:
  - name: lookback_date
    offset_expression: "-24h"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    timezone: "UTC"
    description: "24-hour lookback window"

# ????????????????????????????????????????????????????????????????
# Scheduler Configuration
# ????????????????????????????????????????????????????????????????
scheduler:
  cron_expression: "0 2 * * *"  # Daily at 2 AM
  queue: daily-sync
  server:
    name: legacy-api
    # Path includes both static variables AND pagination placeholder
    # {page_number} will be handled by pagination strategy
    address: "{api_base}/Jobs/GetLatest/{job_id}/{page_number}/{page_size}?since={lookback_date}"
    authentication:
      type: api_key
      header: X-API-Key
      secret_env: API_KEY
    timeout_seconds: 60

# ????????????????????????????????????????????????????????????????
# 3. PAGINATION VARIABLES (Path-Based)
# ????????????????????????????????????????????????????????????????
pagination:
  strategy: "page-based"
  page_size: 50
  max_pages: 100
  options:
    # Tell the strategy that page_number is in the path
    page_param: "page_number"
    page_in_path: true
    # Some APIs start at page 0, others at page 1
    start_page: 1

forwarding:
  destinations:
    - name: data-warehouse
      type: http
      url: "https://warehouse.example.com/api/jobs/{job_id}"
      method: POST
      retry_policy:
        max_attempts: 3
        backoff: exponential

telemetry:
  enabled: true

# ????????????????????????????????????????????????????????????????
# HOW THIS WORKS:
# ????????????????????????????????????????????????????????????????
#
# At runtime (2025-01-15 02:00 UTC):
#
# Step 1: Resolve DATE variables
#   {lookback_date} ? 2025-01-14T02:00:00Z (24 hours ago)
#
# Step 2: Resolve STATIC variables
#   {api_base}    ? https://api.ci.example
#   {job_id}      ? 12345
#   {page_size}   ? 50
#
# Step 3: Pagination strategy handles {page_number}
#   Page 1: {page_number} ? 1
#   Page 2: {page_number} ? 2
#   Page 3: {page_number} ? 3
#   etc.
#
# Final URLs:
#   Page 1: https://api.ci.example/Jobs/GetLatest/12345/1/50?since=2025-01-14T02:00:00Z
#   Page 2: https://api.ci.example/Jobs/GetLatest/12345/2/50?since=2025-01-14T02:00:00Z
#   Page 3: https://api.ci.example/Jobs/GetLatest/12345/3/50?since=2025-01-14T02:00:00Z
#
# ????????????????????????????????????????????????????????????????
