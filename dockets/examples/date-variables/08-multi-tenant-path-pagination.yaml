# Multi-Organization Path-Based Pagination
#
# Demonstrates path-based pagination across multiple organizations
# API Pattern: /{org_id}/resource/{resource_type}/{page}/{size}?filters
#
# This combines:
# - Multi-organization expansion
# - Static variables (org_id, resource_type)
# - Date variables (lookback_date)
# - Path-based pagination (page, size)

name: multi-org-path-pagination
version: 1.0.0
type: poller
plugin_location: ./plugins/DataParser.dll

# ????????????????????????????????????????????????????????????????
# Base Configuration
# ????????????????????????????????????????????????????????????????
base_configuration:
  api_base: "https://api.ci.example"
  page_size: "100"

# ????????????????????????????????????????????????????????????????
# Date Variables (Global Default)
# ????????????????????????????????????????????????????????????????
date_variables:
  - name: lookback_date
    offset_expression: "-2h"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"

# ????????????????????????????????????????????????????????????????
# Scheduler
# ????????????????????????????????????????????????????????????????
scheduler:
  cron_expression: "0 * * * *"  # Hourly
  queue: path-pagination

# ????????????????????????????????????????????????????????????????
# Multi-Organization Configuration
# ????????????????????????????????????????????????????????????????
multi_tenant:
  max_parallel_jobs: 3

tenants:
  - tenant_id: ORG_MAIN
    display_name: "Main Organization"
    enabled: true
    configuration:
      org_code: "ORG001"
    
  - tenant_id: QUICKSYNC
    display_name: "Quick Sync Center"
    enabled: true
    configuration:
      org_code: "ORG002"
    # Override: shorter lookback for quick sync
    date_variables:
      - name: lookback_date
        offset_expression: "-30m"
        format: "yyyy-MM-dd'T'HH:mm:ss'Z'"

# ????????????????????????????????????????????????????????????????
# Endpoints with Path-Based Pagination
# ????????????????????????????????????????????????????????????????
endpoints:
  - endpoint_id: Runs
    display_name: "CI Runs"
    enabled: true
    configuration:
      resource_type: "Runs"
      # Path-based URL: /{org_id}/resource/{resource_type}/{page}/{page_size}
      base_url: "{api_base}/{tenant_id}/resource/{resource_type}/{page}/{page_size}?updated_after={lookback_date}"
    
    # Pagination in path
    pagination:
      strategy: "page-based"
      page_size: 100
      max_pages: 50
      options:
        page_param: "page"
        page_in_path: true
        start_page: 1
  
  - endpoint_id: Artifacts
    display_name: "Build Artifacts"
    enabled: true
    configuration:
      resource_type: "Artifacts"
      artifact_type: "build"
      base_url: "{api_base}/{tenant_id}/resource/{resource_type}/{page}/{page_size}?updated_after={lookback_date}&type={artifact_type}"
    
    # Smaller page size for artifacts
    pagination:
      strategy: "page-based"
      page_size: 50
      max_pages: 100
      options:
        page_param: "page"
        page_in_path: true
        start_page: 1

forwarding:
  destinations:
    - name: centralized-warehouse
      type: http
      url: "https://warehouse.example.com/api/{tenant_id}/{resource_type}"
      method: POST
      headers:
        X-Org-Code: "{org_code}"
      retry_policy:
        max_attempts: 3
        backoff: exponential

telemetry:
  enabled: true

# ????????????????????????????????????????????????????????????????
# EXPANDED JOBS (Tenant × Endpoint Matrix):
# ????????????????????????????????????????????????????????????????
#
# Job 1: ORG_MAIN :: Runs (2-hour lookback)
#   Page 1: https://api.ci.example/ORG_MAIN/resource/Runs/1/100?updated_after=2025-01-15T13:00:00Z
#   Page 2: https://api.ci.example/ORG_MAIN/resource/Runs/2/100?updated_after=2025-01-15T13:00:00Z
#
# Job 2: ORG_MAIN :: Artifacts (2-hour lookback)
#   Page 1: https://api.ci.example/ORG_MAIN/resource/Artifacts/1/50?updated_after=2025-01-15T13:00:00Z&type=build
#   Page 2: https://api.ci.example/ORG_MAIN/resource/Artifacts/2/50?updated_after=2025-01-15T13:00:00Z&type=build
#
# Job 3: QUICKSYNC :: Runs (30-min lookback - OVERRIDDEN)
#   Page 1: https://api.ci.example/QUICKSYNC/resource/Runs/1/100?updated_after=2025-01-15T14:30:00Z
#   Page 2: https://api.ci.example/QUICKSYNC/resource/Runs/2/100?updated_after=2025-01-15T14:30:00Z
#
# Job 4: QUICKSYNC :: Artifacts (30-min lookback - OVERRIDDEN)
#   Page 1: https://api.ci.example/QUICKSYNC/resource/Artifacts/1/50?updated_after=2025-01-15T14:30:00Z&type=build
#   Page 2: https://api.ci.example/QUICKSYNC/resource/Artifacts/2/50?updated_after=2025-01-15T14:30:00Z&type=build
#
# ????????????????????????????????????????????????????????????????
# KEY POINTS:
# ????????????????????????????????????????????????????????????????
#
# 1. Static variables ({tenant_id}, {resource_type}, {page_size}):
#    Resolved once before pagination starts
#
# 2. Date variables ({lookback_date}):
#    Resolved once per job execution
#    Can be overridden per tenant
#
# 3. Path pagination variables ({page}):
#    Resolved per page by pagination strategy
#    Increments: 1, 2, 3, 4, ...
#
# ? All three variable types work together in the URL path!
#
# ????????????????????????????????????????????????????????????????
