# Multi-Tenant Path-Based Pagination
#
# Demonstrates path-based pagination across multiple tenants
# API Pattern: /{tenant_id}/resource/{resource_type}/{page}/{size}?filters
#
# This combines:
# - Multi-tenant expansion
# - Static variables (tenant_id, resource_type)
# - Date variables (lookback_date)
# - Path-based pagination (page, size)

name: multi-tenant-path-pagination
version: 1.0.0
type: poller
plugin_location: ./plugins/FhirParser.dll

# ????????????????????????????????????????????????????????????????
# Base Configuration
# ????????????????????????????????????????????????????????????????
base_configuration:
  api_base: "https://api.ehr.com"
  page_size: "100"

# ????????????????????????????????????????????????????????????????
# Date Variables (Global Default)
# ????????????????????????????????????????????????????????????????
date_variables:
  - name: lookback_date
    offset_expression: "-2h"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"

# ????????????????????????????????????????????????????????????????
# Scheduler
# ????????????????????????????????????????????????????????????????
scheduler:
  cron_expression: "0 * * * *"  # Hourly
  queue: path-pagination

# ????????????????????????????????????????????????????????????????
# Multi-Tenant Configuration
# ????????????????????????????????????????????????????????????????
multi_tenant:
  max_parallel_jobs: 3

tenants:
  - tenant_id: MAIN_HOSPITAL
    display_name: "Main Hospital"
    enabled: true
    configuration:
      facility_code: "MH001"
    
  - tenant_id: URGENT_CARE
    display_name: "Urgent Care Center"
    enabled: true
    configuration:
      facility_code: "UC001"
    # Override: shorter lookback for urgent care
    date_variables:
      - name: lookback_date
        offset_expression: "-30m"
        format: "yyyy-MM-dd'T'HH:mm:ss'Z'"

# ????????????????????????????????????????????????????????????????
# Endpoints with Path-Based Pagination
# ????????????????????????????????????????????????????????????????
endpoints:
  - endpoint_id: Patient
    display_name: "Patient Resource"
    enabled: true
    configuration:
      resource_type: "Patient"
      # Path-based URL: /{tenant_id}/resource/{resource_type}/{page}/{page_size}
      base_url: "{api_base}/{tenant_id}/resource/{resource_type}/{page}/{page_size}?updated_after={lookback_date}"
    
    # Pagination in path
    pagination:
      strategy: "page-based"
      page_size: 100
      max_pages: 50
      options:
        page_param: "page"
        page_in_path: true
        start_page: 1
  
  - endpoint_id: Observation
    display_name: "Lab Results"
    enabled: true
    configuration:
      resource_type: "Observation"
      category: "laboratory"
      base_url: "{api_base}/{tenant_id}/resource/{resource_type}/{page}/{page_size}?updated_after={lookback_date}&category={category}"
    
    # Smaller page size for lab results
    pagination:
      strategy: "page-based"
      page_size: 50
      max_pages: 100
      options:
        page_param: "page"
        page_in_path: true
        start_page: 1

forwarding:
  destinations:
    - name: centralized-warehouse
      type: http
      url: "https://warehouse.internal.com/api/{tenant_id}/{resource_type}"
      method: POST
      headers:
        X-Facility-Code: "{facility_code}"
      retry_policy:
        max_attempts: 3
        backoff: exponential

telemetry:
  enabled: true

# ????????????????????????????????????????????????????????????????
# EXPANDED JOBS (Tenant × Endpoint Matrix):
# ????????????????????????????????????????????????????????????????
#
# Job 1: MAIN_HOSPITAL :: Patient (2-hour lookback)
#   Page 1: https://api.ehr.com/MAIN_HOSPITAL/resource/Patient/1/100?updated_after=2025-01-15T13:00:00Z
#   Page 2: https://api.ehr.com/MAIN_HOSPITAL/resource/Patient/2/100?updated_after=2025-01-15T13:00:00Z
#
# Job 2: MAIN_HOSPITAL :: Observation (2-hour lookback)
#   Page 1: https://api.ehr.com/MAIN_HOSPITAL/resource/Observation/1/50?updated_after=2025-01-15T13:00:00Z&category=laboratory
#   Page 2: https://api.ehr.com/MAIN_HOSPITAL/resource/Observation/2/50?updated_after=2025-01-15T13:00:00Z&category=laboratory
#
# Job 3: URGENT_CARE :: Patient (30-min lookback - OVERRIDDEN)
#   Page 1: https://api.ehr.com/URGENT_CARE/resource/Patient/1/100?updated_after=2025-01-15T14:30:00Z
#   Page 2: https://api.ehr.com/URGENT_CARE/resource/Patient/2/100?updated_after=2025-01-15T14:30:00Z
#
# Job 4: URGENT_CARE :: Observation (30-min lookback - OVERRIDDEN)
#   Page 1: https://api.ehr.com/URGENT_CARE/resource/Observation/1/50?updated_after=2025-01-15T14:30:00Z&category=laboratory
#   Page 2: https://api.ehr.com/URGENT_CARE/resource/Observation/2/50?updated_after=2025-01-15T14:30:00Z&category=laboratory
#
# ????????????????????????????????????????????????????????????????
# KEY POINTS:
# ????????????????????????????????????????????????????????????????
#
# 1. Static variables ({tenant_id}, {resource_type}, {page_size}):
#    Resolved once before pagination starts
#
# 2. Date variables ({lookback_date}):
#    Resolved once per job execution
#    Can be overridden per tenant
#
# 3. Path pagination variables ({page}):
#    Resolved per page by pagination strategy
#    Increments: 1, 2, 3, 4, ...
#
# ? All three variable types work together in the URL path!
#
# ????????????????????????????????????????????????????????????????
