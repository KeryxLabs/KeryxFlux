# CI Run Updates with 1-Hour Lookback
# 
# Scenario: CI system has occasional delays in updating run status.
# We poll every 30 minutes but look back 1 hour to catch any delayed updates.
#
# Example:
# - Current time: 2025-01-15 15:30:00 UTC
# - Poll runs, looks back to: 2025-01-15 14:30:00 UTC
# - Gets all run updates from 14:30 to 15:30 (with some overlap from previous run)

name: ci-runs-lookback
version: 1.0.0
type: poller
plugin_location: ./plugins/DataParser.dll

# Date variable: 1 hour lookback
date_variables:
  - name: lookback_date
    offset_expression: "-1h"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    timezone: "UTC"
    description: "1 hour lookback to catch delayed updates"

scheduler:
  cron_expression: "*/30 * * * *"  # Every 30 minutes
  queue: default
  server:
    name: ci-api
    address: "https://api.ci.example/v1/runs?updated_after={lookback_date}"
    type: http
    authentication:
      type: oauth2
      token_url: "https://api.ci.example/oauth2/token"
      client_id_env: CI_CLIENT_ID
      client_secret_env: CI_CLIENT_SECRET
    timeout_seconds: 60

pagination:
  strategy: "link-header"
  page_size: 100
  max_pages: 0  # Unlimited

forwarding:
  destinations:
    - name: data-warehouse
      type: http
      url: "https://warehouse.example.com/api/runs"
      method: POST
      retry_policy:
        max_attempts: 3
        backoff: exponential

telemetry:
  enabled: true
  trace_headers: true
