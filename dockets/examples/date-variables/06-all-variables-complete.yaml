# Complete Example: Static + Date + Pagination Variables
#
# This docket demonstrates ALL THREE variable types working together:
# 1. Static variables (environment, tenant_id, api_version)
# 2. Date variables (lookback_date)
# 3. Pagination variables (offset, limit, cursor, etc.)
#
# Scenario: Multi-tenant Epic FHIR sync with lookback windows and pagination

name: complete-patient-sync-all-variables
version: 1.0.0
type: poller
plugin_location: ./plugins/FhirParser.dll

# ????????????????????????????????????????????????????????????????
# 1. STATIC VARIABLES (Configuration)
# ????????????????????????????????????????????????????????????????
base_configuration:
  environment: production
  api_version: R4
  fhir_base: "https://fhir.epic.com"
  region: us-east-1

# ????????????????????????????????????????????????????????????????
# 2. DATE VARIABLES (Dynamic Time-Based)
# ????????????????????????????????????????????????????????????????
date_variables:
  - name: lookback_start
    offset_expression: "-2h"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    timezone: "UTC"
    description: "2-hour lookback window start"
    
  - name: lookback_end
    offset_expression: "0"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    timezone: "UTC"
    description: "Current time (end of window)"

# ????????????????????????????????????????????????????????????????
# Scheduler Configuration
# ????????????????????????????????????????????????????????????????
scheduler:
  cron_expression: "0 * * * *"  # Every hour
  queue: patient-sync

# ????????????????????????????????????????????????????????????????
# Multi-Tenant Configuration
# ????????????????????????????????????????????????????????????????
multi_tenant:
  max_parallel_jobs: 3
  fail_fast: false

tenants:
  - tenant_id: MAIN_HOSPITAL
    display_name: "Main Hospital - Downtown"
    enabled: true
    configuration:
      facility_code: "MH001"
      contact_email: "it@mainhospital.com"
    # Uses global 2-hour lookback
    
  - tenant_id: URGENT_CARE_EAST
    display_name: "Urgent Care - East Campus"
    enabled: true
    configuration:
      facility_code: "UC001"
      contact_email: "it@urgentcare-east.com"
    # Override: Shorter lookback for urgent care
    date_variables:
      - name: lookback_start
        offset_expression: "-30m"
        format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
      - name: lookback_end
        offset_expression: "0"
        format: "yyyy-MM-dd'T'HH:mm:ss'Z'"

endpoints:
  - endpoint_id: Patient
    display_name: "Patient Resource"
    enabled: true
    configuration:
      resource_type: "Patient"
      # URL template with STATIC and DATE variables
      base_url: "{fhir_base}/{tenant_id}/api/FHIR/{api_version}/Patient?_lastUpdated=ge{lookback_start}&_lastUpdated=le{lookback_end}"
    
    # ????????????????????????????????????????????????????????????????
    # 3. PAGINATION VARIABLES (Handled by Strategy)
    # ????????????????????????????????????????????????????????????????
    pagination:
      strategy: "link-header"  # Uses Link header for next page
      page_size: 100
      max_pages: 50  # Safety limit
  
  - endpoint_id: Observation
    display_name: "Observation Resource (Labs)"
    enabled: true
    configuration:
      resource_type: "Observation"
      base_url: "{fhir_base}/{tenant_id}/api/FHIR/{api_version}/Observation?date=ge{lookback_start}&date=le{lookback_end}&category=laboratory"
    
    # Different pagination strategy
    pagination:
      strategy: "offset-limit"
      page_size: 200
      max_pages: 100
      options:
        offset_param: "_offset"  # Epic-specific parameter name
        limit_param: "_count"    # Epic-specific parameter name

forwarding:
  destinations:
    - name: data-warehouse
      type: http
      url: "https://warehouse.internal.com/api/fhir/{resource_type}/{tenant_id}"
      method: POST
      headers:
        X-Environment: "{environment}"
        X-Region: "{region}"
        X-Facility: "{facility_code}"
      retry_policy:
        max_attempts: 3
        backoff: exponential

telemetry:
  enabled: true
  trace_headers: true

# ????????????????????????????????????????????????????????????????
# HOW THIS WORKS:
# ????????????????????????????????????????????????????????????????
#
# For MAIN_HOSPITAL + Patient endpoint at 15:00 UTC:
#
# Step 1: Resolve DATE variables
#   {lookback_start} ? 2025-01-15T13:00:00Z (2 hours ago)
#   {lookback_end}   ? 2025-01-15T15:00:00Z (now)
#
# Step 2: Resolve STATIC variables
#   {fhir_base}   ? https://fhir.epic.com
#   {tenant_id}   ? MAIN_HOSPITAL
#   {api_version} ? R4
#
# Step 3: Initial URL
#   https://fhir.epic.com/MAIN_HOSPITAL/api/FHIR/R4/Patient?_lastUpdated=ge2025-01-15T13:00:00Z&_lastUpdated=le2025-01-15T15:00:00Z
#
# Step 4: Pagination (if needed)
#   Page 1: (no pagination params - link-header strategy)
#   Page 2: Uses "next" link from response headers
#   Page 3: Uses "next" link from response headers
#   etc.
#
# ????????????????????????????????????????????????????????????????
# For URGENT_CARE_EAST + Observation endpoint at 15:00 UTC:
#
# Step 1: Resolve DATE variables (OVERRIDDEN)
#   {lookback_start} ? 2025-01-15T14:30:00Z (30 min ago - tenant override)
#   {lookback_end}   ? 2025-01-15T15:00:00Z (now)
#
# Step 2: Resolve STATIC variables
#   {fhir_base}   ? https://fhir.epic.com
#   {tenant_id}   ? URGENT_CARE_EAST
#   {api_version} ? R4
#
# Step 3: Initial URL
#   https://fhir.epic.com/URGENT_CARE_EAST/api/FHIR/R4/Observation?date=ge2025-01-15T14:30:00Z&date=le2025-01-15T15:00:00Z&category=laboratory
#
# Step 4: Pagination (offset-limit strategy)
#   Page 1: ...&_offset=0&_count=200
#   Page 2: ...&_offset=200&_count=200
#   Page 3: ...&_offset=400&_count=200
#   etc.
# ????????????????????????????????????????????????????????????????
