# Complete Example: Static + Date + Pagination Variables
#
# This docket demonstrates ALL THREE variable types working together:
# 1. Static variables (environment, org_id, api_version)
# 2. Date variables (lookback_date)
# 3. Pagination variables (offset, limit, cursor, etc.)
#
# Scenario: Multi-org CI sync with lookback windows and pagination

name: complete-ci-sync-all-variables
version: 1.0.0
type: poller
plugin_location: ./plugins/DataParser.dll

# ????????????????????????????????????????????????????????????????
# 1. STATIC VARIABLES (Configuration)
# ????????????????????????????????????????????????????????????????
base_configuration:
  environment: production
  api_version: v1
  ci_base: "https://api.ci.example"
  region: us-east-1

# ????????????????????????????????????????????????????????????????
# 2. DATE VARIABLES (Dynamic Time-Based)
# ????????????????????????????????????????????????????????????????
date_variables:
  - name: lookback_start
    offset_expression: "-2h"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    timezone: "UTC"
    description: "2-hour lookback window start"
    
  - name: lookback_end
    offset_expression: "0"
    format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    timezone: "UTC"
    description: "Current time (end of window)"

# ????????????????????????????????????????????????????????????????
# Scheduler Configuration
# ????????????????????????????????????????????????????????????????
scheduler:
  cron_expression: "0 * * * *"  # Every hour
  queue: ci-sync

# ????????????????????????????????????????????????????????????????
# Multi-Organization Configuration
# ????????????????????????????????????????????????????????????????
multi_tenant:
  max_parallel_jobs: 3
  fail_fast: false

tenants:
  - tenant_id: ORG_MAIN
    display_name: "Main Organization"
    enabled: true
    configuration:
      org_code: "ORG001"
      contact_email: "devops@mainorg.com"
    # Uses global 2-hour lookback
    
  - tenant_id: QUICKSYNC_EAST
    display_name: "Quick Sync - East Location"
    enabled: true
    configuration:
      org_code: "ORG002"
      contact_email: "devops@quicksync-east.com"
    # Override: Shorter lookback for quick sync
    date_variables:
      - name: lookback_start
        offset_expression: "-30m"
        format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
      - name: lookback_end
        offset_expression: "0"
        format: "yyyy-MM-dd'T'HH:mm:ss'Z'"

endpoints:
  - endpoint_id: Runs
    display_name: "CI Runs"
    enabled: true
    configuration:
      resource_type: "Runs"
      # URL template with STATIC and DATE variables
      base_url: "{ci_base}/{tenant_id}/api/{api_version}/runs?updated_after={lookback_start}&updated_before={lookback_end}"
    
    # ????????????????????????????????????????????????????????????????
    # 3. PAGINATION VARIABLES (Handled by Strategy)
    # ????????????????????????????????????????????????????????????????
    pagination:
      strategy: "link-header"  # Uses Link header for next page
      page_size: 100
      max_pages: 50  # Safety limit
  
  - endpoint_id: Artifacts
    display_name: "Build Artifacts"
    enabled: true
    configuration:
      resource_type: "Artifacts"
      base_url: "{ci_base}/{tenant_id}/api/{api_version}/artifacts?created_after={lookback_start}&created_before={lookback_end}&type=build"
    
    # Different pagination strategy
    pagination:
      strategy: "offset-limit"
      page_size: 200
      max_pages: 100
      options:
        offset_param: "_offset"  # API-specific parameter name
        limit_param: "_count"    # API-specific parameter name

forwarding:
  destinations:
    - name: data-warehouse
      type: http
      url: "https://warehouse.example.com/api/ci/{resource_type}/{tenant_id}"
      method: POST
      headers:
        X-Environment: "{environment}"
        X-Region: "{region}"
        X-Location: "{location_code}"
      retry_policy:
        max_attempts: 3
        backoff: exponential

telemetry:
  enabled: true
  trace_headers: true

# ????????????????????????????????????????????????????????????????
# HOW THIS WORKS:
# ????????????????????????????????????????????????????????????????
#
# For ORG_MAIN + Runs endpoint at 15:00 UTC:
#
# Step 1: Resolve DATE variables
#   {lookback_start} ? 2025-01-15T13:00:00Z (2 hours ago)
#   {lookback_end}   ? 2025-01-15T15:00:00Z (now)
#
# Step 2: Resolve STATIC variables
#   {ci_base}   ? https://api.ci.example
#   {tenant_id}   ? ORG_MAIN
#   {api_version} ? R4
#
# Step 3: Initial URL
#   https://api.ci.example/ORG_MAIN/api/v1/Runs?_lastUpdated=ge2025-01-15T13:00:00Z&_lastUpdated=le2025-01-15T15:00:00Z
#
# Step 4: Pagination (if needed)
#   Page 1: (no pagination params - link-header strategy)
#   Page 2: Uses "next" link from response headers
#   Page 3: Uses "next" link from response headers
#   etc.
#
# ????????????????????????????????????????????????????????????????
# For QUICKSYNC_EAST + Artifacts endpoint at 15:00 UTC:
#
# Step 1: Resolve DATE variables (OVERRIDDEN)
#   {lookback_start} ? 2025-01-15T14:30:00Z (30 min ago - tenant override)
#   {lookback_end}   ? 2025-01-15T15:00:00Z (now)
#
# Step 2: Resolve STATIC variables
#   {ci_base}   ? https://api.ci.example
#   {tenant_id}   ? QUICKSYNC_EAST
#   {api_version} ? R4
#
# Step 3: Initial URL
#   https://api.ci.example/QUICKSYNC_EAST/api/v1/Artifacts?date=ge2025-01-15T14:30:00Z&date=le2025-01-15T15:00:00Z&category=build
#
# Step 4: Pagination (offset-limit strategy)
#   Page 1: ...&_offset=0&_count=200
#   Page 2: ...&_offset=200&_count=200
#   Page 3: ...&_offset=400&_count=200
#   etc.
# ????????????????????????????????????????????????????????????????
