name: sample-receiver
version: 1.0.0
type: Receiver

# Plugin configuration
plugin_location: "D:\\Health\\KeryxFlux\\plugins\\KeryxFlux.Plugins.SampleReceiver.dll"

# Receiver configuration
receiver:
  type: http
  endpoint: /receive/sample

# Forwarding configuration
forwarding:
  destinations:
    - name: webhook-site
      type: http
      url: https://webhook.site/f0cc3e5d-6e74-4b0b-83e6-eb9abb14ee3d # Replace with your webhook.site URL
      timeout_seconds: 30

# Telemetry (optional)
telemetry:
  enabled: true
  trace_requests: true
