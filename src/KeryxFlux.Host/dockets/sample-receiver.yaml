name: sample-receiver
version: 1.0.0
type: Receiver

# Plugin configuration
plugin_location: "./KeryxFlux.Plugins.SampleReceiver.dll"

# Receiver configuration
receiver:
  type: http
  endpoint: /receive/sample

# Forwarding configuration
forwarding:
  destinations:
    - name: webhook-site
      type: http
      url: https://webhook.example.com/ingest # example destination
      timeout_seconds: 30

# Telemetry (optional)
telemetry:
  enabled: true
  trace_requests: true
